<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --paper:#f2f2ef; --ink:#131417; --ink-3:#6b6e76; --ink-4:#9a9ea6; --line:#d9d9d5;
    --sign:#ffffff;
  }
  html,body{height:100%}
  body{
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    background:var(--paper); color:var(--ink);
    display:grid; place-items:center; padding:28px 18px;
    background-image:radial-gradient(circle at 50% 0%, #f7f7f4 0%, var(--paper) 60%);
  }
  main{width:100%;max-width:420px;text-align:center}
  .brand{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:-.01em;margin-bottom:26px}
  .mark{width:24px;height:24px;border-radius:7px;background:var(--ink);display:inline-flex;align-items:center;justify-content:center}
  .mark svg{display:block}
  /* the sign */
  .sign{
    background:var(--sign); border:2.5px solid var(--ink); border-radius:14px;
    padding:30px 26px 24px; box-shadow:0 24px 60px -24px rgba(19,20,23,.28), 0 2px 0 rgba(19,20,23,.06);
    animation:in .7s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.sign{animation:none}}
  .cap{font-size:12.5px;font-weight:800;letter-spacing:.22em;margin-bottom:20px}
  .qr{width:150px;height:150px;margin:0 auto;color:var(--ink)}
  .qr svg{width:100%;height:100%;display:block}
  .soon{
    margin:22px auto 6px; font-size:27px; font-weight:800; letter-spacing:-.02em; line-height:1.15;
    text-wrap:balance;
  }
  .sub{font-size:13.5px;color:var(--ink-3);line-height:1.6;max-width:30ch;margin:0 auto}
  .rule{height:0;border-top:1.5px dashed var(--line);margin:20px 0 14px}
  .foot{font-size:11px;color:var(--ink-4);letter-spacing:.02em}
  .foot b{color:var(--ink-3);font-weight:700}
  .under{margin-top:24px;font-size:12px;color:var(--ink-4)}
  .under a{color:var(--ink-3);font-weight:650;text-decoration:underline;text-underline-offset:3px}
  .under a:hover{color:var(--ink)}
</style>
